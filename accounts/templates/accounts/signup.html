<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Trading Platform</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;

            background: #111827;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        h1 {
            text-align: center;
            margin: 0 0 25px;
            font-size: 28px;
        }

        input {
            width: 100%;

            padding: 13px;

            margin: 8px 0;

            border: 1px solid #334155;
            border-radius: 6px;

            background: #0f172a;
            color: white;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        input::placeholder {
            color: #64748b;
        }

        button {
            width: 100%;

            padding: 13px;

            margin-top: 15px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .login {
            text-align: center;

            margin-top: 22px;

            color: #94a3b8;

            line-height: 1.5;

            /* Important */
            white-space: nowrap;
        }

        .login a {
            color: #60a5fa;

            text-decoration: none;

            font-weight: bold;

            margin-left: 4px;

            /* Important */
            white-space: nowrap;
        }

        .login a:hover {
            text-decoration: underline;
        }

        .message {
            color: #f87171;

            text-align: center;

            margin: 8px 0;
        }


        /* MOBILE */
        @media (max-width: 450px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 25px 18px;
            }

            h1 {
                font-size: 24px;

                margin-bottom: 20px;
            }

            .login {
                font-size: 14px;

                white-space: nowrap;
            }

            .login a {
                white-space: nowrap;
            }
        }

    </style>
</head>


<body>

<div class="container">

    <h1>Create Account</h1>


    {% if messages %}

        {% for message in messages %}

            <p class="message">
                {{ message }}
            </p>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >


        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >


        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >


        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
        >


        <button type="submit">
            Create Account
        </button>

    </form>


    <div class="login">
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </div>


</div>

</body>
</html>
